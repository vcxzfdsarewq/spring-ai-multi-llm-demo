spring:
  ai:
    model:
      chat: openai
      embedding: openai
    ollama:
      chat:
        enabled: false
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: ${OPENAI_MODEL:gpt-4o}
          temperature: 0.7
      embedding:
        options:
          model: ${OPENAI_EMBED_MODEL:text-embedding-3-small}
          dimensions: 768

app:
  llm:
    model: ${OPENAI_MODEL:gpt-4o}
