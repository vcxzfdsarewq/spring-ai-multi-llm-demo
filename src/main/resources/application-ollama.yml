spring:
  ai:
    model:
      chat: ollama
      embedding: ollama
    openai:
      chat:
        enabled: false
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${OLLAMA_MODEL:gemma4:e4b}
          temperature: 0.7
          num-predict: -1
          num-thread: ${OLLAMA_NUM_THREAD:8}
      embedding:
        options:
          model: ${OLLAMA_EMBED_MODEL:nomic-embed-text}

app:
  llm:
    model: ${OLLAMA_MODEL:gemma4:e4b}
